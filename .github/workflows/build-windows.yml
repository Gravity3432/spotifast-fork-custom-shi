      - name: Set up the Windows C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.architecture == 'ARM64' && 'arm64' || 'x64' }}

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed" }
          rustup target add --toolchain 1.98.0 $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw "Rust target installation failed" }
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw "Source formatting check failed" }

      - name: Prepare MilkDrop dependencies (not a stripped-down build)
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            if ($env:VCPKG_ROOT) { $env:VCPKG_INSTALLATION_ROOT = $env:VCPKG_ROOT }
            elseif (Test-Path 'C:\vcpkg\vcpkg.exe') { $env:VCPKG_INSTALLATION_ROOT = 'C:\vcpkg' }
            else { throw "This runner is missing vcpkg. Share this failed step's log." }
          }
          "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "glew:$env:VCPKG_TRIPLET"
          if ($LASTEXITCODE -ne 0) { throw "GLEW installation failed" }
          Get-Command cmake -ErrorAction Stop | Out-Null
          Get-Command ninja -ErrorAction Stop | Out-Null
          if (-not $env:LIBCLANG_PATH) {
            $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
            if (Test-Path "$llvm\libclang.dll") {
              "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
            }
          }

      - name: Test artwork and native button handling on Windows
        run: |
          cargo test --locked --target $env:TARGET --test artwork --test artwork_decode
          if ($LASTEXITCODE -ne 0) { throw "Artwork tests failed; no installer will be published" }

      - name: Build the full release application, including MilkDrop
        run: |
          cargo build --release --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }

      - name: Check the executable's architecture and standalone runtime
        run: |
          $binary = "target\$env:TARGET\release\spotifast.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the executable" }
          if ($imports -match 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll|glew32\.dll') {
            throw "The build depends on a runtime DLL that is not bundled: $imports"
          }
          $headers = & dumpbin /headers $binary | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Could not read executable headers" }
          $machine = if ($env:INNO_ARCH -eq 'aarch64') { 'AA64 machine \(ARM64\)' } else { '8664 machine \(x64\)' }
          if ($headers -notmatch $machine) { throw "The executable has the wrong architecture" }
          $version = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^spotifast 0\.13\.0') {
            throw "The executable did not start correctly: $version"
          }
          Write-Host $version

      - name: Clearly label the custom installer
        shell: python
        run: |
          import json, os, tomllib
          from pathlib import Path
          metadata = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))
          if 'milkdrop' not in metadata['features']['default']:
              raise SystemExit('The default build no longer includes MilkDrop. Stop rather than omit it.')
          repo = 'https://github.com/' + os.environ['CUSTOM_BUILD_REPOSITORY']
          path = Path('packaging/windows/spotifast.iss')
          script = path.read_text(encoding='utf-8-sig')
          replacements = {
              'AppVerName={#AppName} {#Version}': 'AppVerName={#AppName} {#Version} (Custom Artwork)',
              'AppPublisher=Carmine Paolino': 'AppPublisher=Unofficial custom artwork build',
              'AppPublisherURL=https://spotifast.rocks': 'AppPublisherURL=' + repo,
              'AppSupportURL=https://github.com/crmne/spotifast/issues': 'AppSupportURL=' + repo,
              'AppUpdatesURL=https://spotifast.rocks/download/': 'AppUpdatesURL=' + repo + '/actions',
              'OutputBaseFilename=spotifast-v{#Version}-{#Arch}-pc-windows-msvc-setup': 'OutputBaseFilename=Spotifast-Custom-Setup-{#Arch}',
              'LicenseFile=..\\..\\LICENSE': 'InfoBeforeFile=custom-build-notice.txt\nLicenseFile=..\\..\\LICENSE',
          }
          for old, new in replacements.items():
              if script.count(old) != 1:
                  raise SystemExit('Unexpected installer template: ' + old)
              script = script.replace(old, new)
          script = script.replace('[Files]', '[Files]\nSource: "custom-build-notice.txt"; DestDir: "{app}"; Flags: ignoreversion', 1)
          path.write_text(script, encoding='utf-8-sig')
          notice = '''UNOFFICIAL SPOTIFAST CUSTOM ARTWORK BUILD

          Includes independent media-button skins, hover/continuous GIFs, layers,
          presets, an installed-font picker, a color-theme maker, and extended
          player-bar artwork. Previous shared-artwork settings remain compatible.
          Default features include MilkDrop. Continuous GIFs add rendering work.
          This is not an official release and is not code-signed.

          Quit Spotifast, including its tray icon, before installing.
          This uses the original installer identity and application profile.
          It can replace the existing per-user Spotifast installation in the
          selected folder. Back up your settings first. This build is based on
          0.13.0; do not blindly install it over a newer upstream version.

          The app's updater still points to official Spotifast releases.
          Installing an official update will remove these custom controls.
          To keep the custom changes, use an updated custom build instead.

          No Spotify credentials are needed for the build. Live playback, GIF
          performance, and GPU behavior still need testing on your own PC.
          Windows may warn about an unknown publisher. Do not disable antivirus.
          Only install an artifact from a build/repository you trust.

          Original Spotifast copyright and MIT license remain unchanged.
          '''
          notice = '\n'.join(line.strip() for line in notice.splitlines()) + '\n'
          Path('packaging/windows/custom-build-notice.txt').write_text(notice, encoding='utf-8-sig')
          out = Path('dist'); out.mkdir(exist_ok=True)
          (out / 'READ-ME-FIRST.txt').write_text(notice + '\nAfter installing: Settings -> search studio for media skins, fonts, themes, and presets. Search artwork for shared/player-bar art.\n', encoding='utf-8')
          info = {
              'upstream_commit': '36964f19e2fb1154d5e87973d76928c7ddbeaf06',
              'artwork_patch_sha256': 'ce5d568dfc5ff486ccd8ea046ac53edc4ae7f96ae5aca0ea647b8383e34ef2a3',
              'version': metadata['package']['version'],
              'custom_build': 'artwork2-customization-studio',
              'default_features': metadata['features']['default'],
              'target': os.environ['TARGET'],
              'build_repository': os.environ['CUSTOM_BUILD_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'signed': False,
          }
          (out / 'BUILD-INFO.json').write_text(json.dumps(info, indent=2) + '\n', encoding='utf-8')

      - name: Create the actual Setup.exe with Inno Setup
        run: |
          function Find-InnoCompiler {
            $command = Get-Command iscc -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          $iscc = Find-InnoCompiler
          if (-not $iscc) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -notin @(0, 3010)) { throw "Inno Setup installation failed" }
            $iscc = Find-InnoCompiler
          }
          if (-not $iscc) { throw "Inno Setup's compiler could not be found" }
          & $iscc '/DVersion=0.13.0-artwork2' "/DArch=$env:INNO_ARCH" `
            "/DBinary=$PWD\target\$env:TARGET\release\spotifast.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\spotifast.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      - name: Install and uninstall on the disposable build machine
        run: |
          $setup = (Resolve-Path "dist\Spotifast-Custom-Setup-$env:INNO_ARCH.exe").Path
          $installed = Join-Path $env:RUNNER_TEMP 'spotifast-installer-smoke'
          $args = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installed`"")
          $result = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer smoke test failed: $($result.ExitCode)" }
          $version = (& "$installed\spotifast.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^spotifast 0\.13\.0') {
            throw "The installed executable did not start: $version"
          }
          $result = Start-Process -FilePath "$installed\unins000.exe" `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller smoke test failed: $($result.ExitCode)" }
          Get-FileHash -Algorithm SHA256 $setup | ForEach-Object {
            "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))"
          } | Set-Content dist\SHA256SUMS.txt

      - name: Download your Windows installer here
        id: installer_artifact
        uses: actions/upload-artifact@v7
        with:
          name: Spotifast-Custom-Windows-${{ inputs.architecture }}
          path: |
            source/dist/Spotifast-Custom-Setup-*.exe
            source/dist/READ-ME-FIRST.txt
            source/dist/BUILD-INFO.json
            source/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Show the download instructions
        run: |
          @'
          ## Your custom installer is ready
          Download the **Spotifast-Custom-Windows** artifact at the bottom of this run.
          GitHub wraps artifacts in a ZIP. Extract it and run **Spotifast-Custom-Setup-*.exe** inside.
          Quit the old app first. This is an unsigned custom installer, not an official release.
          Open **Settings**, search **artwork**, and import your images.
          MilkDrop is included. Real playback/GPU performance is not verified by this build job.
          '@ >> $env:GITHUB_STEP_SUMMARY
