# Put this ONE file at .github/workflows/build-windows.yml in your own repository.
# No source ZIP, credentials, secrets, or local compiler is required.
# Manual only: this fetches pinned upstream source and applies the embedded patch.
name: Build my Spotifast installer

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Your Windows PC (usually Intel / AMD x64)"
        type: choice
        required: true
        default: Intel-AMD-x64
        options:
          - Intel-AMD-x64
          - ARM64

permissions:
  contents: read

concurrency:
  group: spotifast-installer-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  installer:
    name: Windows installer with Customization Studio and MilkDrop
    runs-on: ${{ inputs.architecture == 'ARM64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CMAKE_GENERATOR: Ninja
      TARGET: ${{ inputs.architecture == 'ARM64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
      INNO_ARCH: ${{ inputs.architecture == 'ARM64' && 'aarch64' || 'x86_64' }}
      VCPKG_TRIPLET: ${{ inputs.architecture == 'ARM64' && 'arm64-windows-static' || 'x64-windows-static' }}
      CUSTOM_BUILD_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Keep patch line endings unchanged
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "Unable to configure Git" }

      - name: Get the exact original Spotifast source
        uses: actions/checkout@v7
        with:
          repository: crmne/spotifast
          ref: 36964f19e2fb1154d5e87973d76928c7ddbeaf06
          path: source
          persist-credentials: false

